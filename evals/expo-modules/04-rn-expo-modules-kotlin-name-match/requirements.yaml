version: 1
inputs:
  files:
    - app/App.tsx
    - app/index.ts
    - app/modules/WeatherInlineModule.kt
requirements:
  - id: kotlin-file-class-match
    description: "Must make the Kotlin file name match the Kotlin module class name."
  - id: kotlin-name-matches-class
    description: "Must set Name(\"...\") to match the class name, or omit Name when the class name already matches."
  - id: uses-kotlin-module-dsl
    description: "Must extend expo.modules.kotlin.modules.Module and return ModuleDefinition."
  - id: kotlin-js-wrapper-same-name
    description: "Must require the native module from JS using the same name."
