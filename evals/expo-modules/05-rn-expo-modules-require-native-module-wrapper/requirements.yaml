version: 1
inputs:
  files:
    - app/App.tsx
requirements:
  - id: uses-require-native-module
    description: "Must import requireNativeModule from expo-modules-core."
  - id: typed-native-surface
    description: "Must define a TypeScript type/interface for the native module surface."
  - id: exports-js-helper
    description: "Must export a JS helper instead of exposing an untyped native object everywhere."
  - id: name-matches-native-module
    description: "Must pass the exact native module name to requireNativeModule."
