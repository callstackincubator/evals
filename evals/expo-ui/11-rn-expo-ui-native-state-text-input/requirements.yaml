version: 1
inputs:
  files:
    - app/App.tsx
requirements:
  - id: uses-native-state
    description: "Must use useNativeState from @expo/ui for native-shared state."
  - id: textinput-controlled
    description: "Must wire TextInput value/onChangeText to the native state."
  - id: native-state-listener-discipline
    description: "Must clear native state listeners in cleanup."
  - id: host-root
    description: "Must render the Expo UI TextInput under Host."
