version: 1
inputs:
  files:
    - app/App.tsx
requirements:
  - id: community-menu-import
    description: "Must import MenuView from @expo/ui/community/menu."
  - id: community-masked-view-import
    description: "Must import MaskedView from @expo/ui/community/masked-view."
  - id: deterministic-menu-actions
    description: "Must define deterministic menu action ids/titles and handle selected action."
  - id: no-legacy-menu-masked-imports
    description: "Must not import legacy menu or masked-view community packages directly."
