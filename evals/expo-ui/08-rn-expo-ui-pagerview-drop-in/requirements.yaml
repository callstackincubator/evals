version: 1
inputs:
  files:
    - app/App.tsx
requirements:
  - id: community-pagerview-import
    description: "Must import PagerView from @expo/ui/community/pager-view."
  - id: page-selected-state
    description: "Must update state from onPageSelected native event position."
  - id: stable-page-keys
    description: "Must give each page stable keys."
  - id: no-react-native-pager-view-import
    description: "Must not import react-native-pager-view directly."
