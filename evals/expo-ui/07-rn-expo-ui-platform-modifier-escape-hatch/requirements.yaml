version: 1
inputs:
  files:
    - app/App.tsx
requirements:
  - id: platform-entrypoints-isolated
    description: 'Must import SwiftUI APIs from @expo/ui/swift-ui and Jetpack APIs from @expo/ui/jetpack-compose in platform-isolated code.'
  - id: modifiers-from-platform-package
    description: 'Must import modifiers from the matching platform modifiers entrypoint.'
  - id: platform-branch
    description: 'Must branch, via Platform.OS or platform files, so that iOS renders the @expo/ui swift-ui tree and Android renders the @expo/ui jetpack-compose tree.'
