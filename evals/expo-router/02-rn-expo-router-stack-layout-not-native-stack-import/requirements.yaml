version: 1
inputs:
  files:
    - app/_layout.tsx
    - app/index.tsx
requirements:
  - id: uses-expo-router-stack
    description: "Must render Stack from expo-router in _layout.tsx."
  - id: no-create-native-stack-navigator
    description: "Must not call createNativeStackNavigator or NavigationContainer in Expo Router app code."
  - id: registers-screens-by-name
    description: "Must configure Stack.Screen entries by file-route names."
  - id: route-file-present
    description: "Must include a route file matching each configured screen."
