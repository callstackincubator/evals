version: 1
inputs:
  files:
    - app/_layout.tsx
    - app/index.tsx
requirements:
  - id: uses-suspense-fallback
    description: "Must export a route-level SuspenseFallback function from the route module."
  - id: fallback-renders-loading-indicator
    description: "SuspenseFallback must render a visible loading indicator (for example a Text reading \"Loading…\") while the async route content is pending."
  - id: default-export-renders-async-content
    description: "Must keep the route's default export rendering the resolved async content."
  - id: no-global-loading-hack
    description: "Must not replace the route content with a permanent loading screen that never shows the resolved content."
