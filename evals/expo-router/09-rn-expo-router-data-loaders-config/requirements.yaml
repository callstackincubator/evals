version: 1
inputs:
  files:
    - app/app.json
    - app/_layout.tsx
    - app/index.tsx
requirements:
  - id: loader-exported-from-route
    description: "Must export a loader from the route module."
  - id: uses-use-loader-data
    description: "Must read loader results with useLoaderData typed to the loader."
  - id: router-plugin-configured
    description: "Must configure the expo-router plugin with unstable_useServerDataLoaders, unstable_useServerRendering, and web output set to server."
  - id: no-client-fetch-duplication
    description: "Must not duplicate the same data fetch in a client mount effect."
