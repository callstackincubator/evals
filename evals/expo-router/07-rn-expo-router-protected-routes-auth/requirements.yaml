version: 1
inputs:
  files:
    - app/_layout.tsx
    - app/index.tsx
    - app/account.tsx
    - app/sign-in.tsx
requirements:
  - id: uses-stack-protected
    description: 'Must gate routes with Stack.Protected, since the app uses a Stack layout.'
  - id: signed-out-fallback
    description: 'The layout must keep an unguarded, always-available route (such as index or the signed-out sign-in screen) declared so signed-out users deterministically land somewhere instead of a guarded screen.'
  - id: guard-boolean-explicit
    description: 'Must pass explicit guard booleans derived from auth state.'
  - id: no-redirect-loop
    description: 'Must avoid unconditional redirects that can loop between protected and sign-in routes.'
