version: 1
inputs:
  files:
    - app/_layout.tsx
    - app/index.tsx
    - app/settings.tsx
requirements:
  - id: selected-default-icon-state
    description: "Must configure selected/default icon or label state through NativeTabs.Trigger children."
  - id: badge-or-label-child-api
    description: "Must use NativeTabs.Trigger.Label/Icon/Badge child APIs for per-tab presentation."
  - id: route-name-alignment
    description: "Must align tab trigger names with file routes."
  - id: no-generic-tabs-api
    description: "Must not use generic Expo Router Tabs for this native-tabs task."
