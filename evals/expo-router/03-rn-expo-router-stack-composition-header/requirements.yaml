version: 1
inputs:
  files:
    - app/_layout.tsx
    - app/index.tsx
requirements:
  - id: uses-stack-screen-options-for-header
    description: "Must compose header actions via Stack.Screen options (headerRight/headerLeft), not Stack.Toolbar."
  - id: route-options-in-layout
    description: "Must keep screen options in Expo Router Stack layout/screen configuration."
  - id: action-callback-defined
    description: "Must wire header action callbacks to deterministic handlers."
  - id: no-react-navigation-header-imports
    description: "Must not import React Navigation header components or types directly."
