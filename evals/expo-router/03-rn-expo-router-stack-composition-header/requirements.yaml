version: 1
inputs:
  files:
    - app/_layout.tsx
    - app/index.tsx
requirements:
  - id: uses-stack-screen-options-for-header
    description: "Must configure the header via Stack.Screen options (title/headerRight), not Stack.Toolbar."
  - id: header-right-shows-alert
    description: "The headerRight must render a pressable button whose press handler calls Alert.alert."
  - id: sets-title-and-back-button
    description: "Must set the screen title and a back button label via headerBackTitle in the Stack.Screen options."
  - id: no-react-navigation-header-imports
    description: "Must not import React Navigation header components or types directly."
