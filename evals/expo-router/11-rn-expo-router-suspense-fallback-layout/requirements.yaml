version: 1
inputs:
  files:
    - app/_layout.tsx
    - app/index.tsx
requirements:
  - id: uses-suspense-fallback
    description: "Must export a route-level SuspenseFallback function and must not render expo-router's internal SuspenseFallback component directly."
  - id: fallback-has-deterministic-ui
    description: "Must render a deterministic fallback UI while async route content is pending."
  - id: stack-remains-rendered
    description: "Must still render the nested Stack/Slot route outlet."
  - id: no-global-loading-hack
    description: "Must not replace the route outlet with a permanent loading screen."
