version: 1
inputs:
  files:
    - app/App.tsx
    - app/app.config.ts
requirements:
  - id: ios-precompiled-rn-enabled
    description: 'Must explicitly pin the precompiled React Native choice in the plugin ios options (buildReactNativeFromSource: false or the current equivalent) rather than relying on the default.'
  - id: keeps-static-frameworks-intent
    description: 'Must preserve the existing useFrameworks: "static" iOS setting while adding the new build properties.'
  - id: android-sdk-values-current
    description: 'Must set Android compile/target SDK values compatible with SDK 56.'
