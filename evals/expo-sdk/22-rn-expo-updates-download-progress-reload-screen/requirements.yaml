version: 1
inputs:
  files:
    - app/App.tsx
requirements:
  - id: uses-useupdates-state
    description: 'Must use Updates.useUpdates() to read isDownloading, downloadProgress, isUpdateAvailable, isUpdatePending, and currentlyRunning state.'
  - id: download-progress-rendered
    description: 'Must render downloadProgress or a deterministic progress state while downloading.'
  - id: no-post-reload-assumption
    description: 'Must not update React state after awaiting reloadAsync as if execution will reliably continue.'
  - id: handles-disabled-or-error
    description: 'Must render a fallback for unavailable updates or download errors.'
