version: 1
inputs:
  files:
    - app/App.tsx
requirements:
  - id: uses-header-override-api
    description: "Must call Updates.setUpdateRequestHeadersOverride with a record or null."
  - id: clear-override-path
    description: "Must provide a default path that calls setUpdateRequestHeadersOverride(null)."
  - id: no-secret-header-values
    description: "Must not hardcode secrets or authorization tokens in update request headers."
  - id: check-after-header-change
    description: "Must trigger or expose an update check/fetch flow after changing headers."
  - id: visible-selected-cohort
    description: "Must render the active cohort/header selection so behavior is auditable."
