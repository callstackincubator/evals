version: 1
inputs:
  files:
    - app/App.tsx
requirements:
  - id: uses-location-permission-details
    description: "Must inspect platform permission details such as permission.ios?.scope or permission.android?.accuracy when present."
  - id: does-not-assume-precise-location
    description: "Must not assume granted permission implies precise/exact location accuracy."
  - id: fallback-for-approximate
    description: "Must render a specific approximate-location fallback or explanation."
  - id: explicit-location-options
    description: "Must use explicit getCurrentPositionAsync accuracy options."
  - id: settings-recovery-for-blocked
    description: "Must offer Linking.openSettings() when permission canAskAgain is false."
