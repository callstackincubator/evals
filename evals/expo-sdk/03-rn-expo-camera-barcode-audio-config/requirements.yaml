version: 1
inputs:
  files:
    - app/App.tsx
requirements:
  - id: uses-camera-view-barcode-settings
    description: "Must use CameraView with barcodeScannerSettings and onBarcodeScanned instead of the deprecated BarCodeScanner package/API."
  - id: limits-barcode-types
    description: "Must configure an explicit barcodeTypes allowlist containing qr and ean13 instead of accepting every type implicitly."
  - id: deduplicates-scan-results
    description: "Must debounce or deduplicate repeated barcode scan events before updating state."
  - id: microphone-request-on-video-intent
    description: "Must request microphone permission only from the user action that enables video/audio capture."
  - id: audio-gated-video-mode
    description: "Must not enable audio recording controls unless microphone permission is granted or the camera is explicitly muted."
