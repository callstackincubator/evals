version: 1
inputs:
  files:
    - app/App.tsx
requirements:
  - id: uses-canvas-component
    description: Must render all drawing content inside a Canvas component from @shopify/react-native-skia.
    weight: 0.1
  - id: uses-clip-rect
    description: Must use the `clip` prop on a Group component with a rectangle (e.g. from `rect()` or an `{ x, y, width, height }` object) to clip a drawing to a rectangular region.
  - id: uses-clip-path
    description: Must use the `clip` prop on a Group component with a path (an SkPath or SVG path string) to clip a drawing to a non-rectangular shape.
  - id: clip-path-is-non-rectangular
    description: The path-based clip shape must be a non-rectangular polygon, star, or curve — not just a simple rectangle.
  - id: both-clips-applied-to-distinct-drawings
    description: The rectangular clip and the path clip must each be applied to a different visual element (separate Group components) so both clipping techniques are demonstrated independently.
